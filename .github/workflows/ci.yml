name: Verify Margin
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: margin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL for required service integration tests
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib
          pg_config --bindir >> "$GITHUB_PATH"
      - run: npm audit --audit-level=high
      - run: npm sbom --package-lock-only --sbom-format=cyclonedx > margin-sbom.json
      - name: Retain dependency inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: margin-dependency-inventory
          path: margin-sbom.json
          retention-days: 30
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
        env:
          MARGIN_REQUIRE_POSTGRES_TESTS: '1'
      - run: npm run test:marketing
      - run: npm run build
      - run: npm run check:budget -w @margin/marketing
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:offline
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  database-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install local PostgreSQL tools
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib
      - name: Check schema and tenant policies in a disposable cluster
        shell: bash
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          python3 infra/verify-schema.py
